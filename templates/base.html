<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RGSecurityTeam Lab{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
        <span class="text-danger">RG</span>SecurityTeam <span class="badge bg-danger">LAB</span>
      </a>
      <div class="d-flex">
        {% if session.get('username') %}
          <a href="{{ url_for('levels') }}" class="btn btn-outline-light btn-sm me-2">Levels</a>
          <a href="{{ url_for('hijack') }}" class="btn btn-outline-warning btn-sm me-2">Hijack Simulator</a>
          <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="{{ url_for('register') }}" class="btn btn-danger btn-sm">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center text-muted small py-4">
    RGSecurityTeam Vulnerability Lab &middot; For local, offline, educational use only.
  </footer>
</body>
</html>
